name: Validate Skill
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate base skill
        run: python scripts/validate_skill.py
      - name: Validate think-cell inspired chart module
        run: python scripts/validate_thinkcell.py
      - name: Check scripts compile
        run: python -m compileall -q scripts
